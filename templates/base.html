<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Batcomputer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">

        <nav class="side-nav">
            <a href="/" class="nav-icon" title="Início">
                <span class="nav-icon-circle">🏠</span>
                <span class="nav-icon-label">Início</span>
            </a>
            <a href="/sobre" class="nav-icon" title="Sobre mim">
                <span class="nav-icon-circle">👤</span>
                <span class="nav-icon-label">Sobre</span>
            </a>
        </nav>

        <div class="main-area">

            <header class="hud-header">
                <h1 class="hud-title">BATCOMPUTER</h1>
                <div class="top-readouts">
                    <div class="readout" id="clock">--:--:--</div>
                    <div class="readout">Clima {% block clima_readout %}{% endblock %}</div>
                    <div class="readout">R$ {% block dolar_readout %}{% endblock %}</div>
                </div>
            </header>

            <div class="bat-symbol-layer">
                <img class="bat-symbol" src="{{ url_for('static', filename='img/batsinal.png') }}" alt="Símbolo do morcego">
            </div>

            <main class="hud-content">
                {% block content %}
                {% endblock %}
            </main>

            <footer class="hud-footer">
                <span class="footer-tag">SYSTEM</span>
                <span class="footer-line"></span>
                <span class="footer-tag">STATUS: ONLINE</span>
                <span class="footer-line"></span>
                <span class="footer-tag">RAFAEL HOMELAB</span>
            </footer>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
